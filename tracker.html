function Stars({ val, onChange }) {
  const [hov, setHov] = useState(0);
  return (
    <div className="flex" onMouseLeave={() => setHov(0)}>
      {[1,2,3,4,5].map(i => (
        <button key={i} onMouseEnter={() => setHov(i)} onClick={() => onChange?.(i)}
          className="text-lg leading-none focus:outline-none pr-0.5" title={`${i}/5 fit`}>
          <span style={{ color: i <= (hov||val) ? "#f59e0b" : "#e2e8f0" }}>★</span>
        </button>
      ))}
    </div>
  );
}

function TrackBadge({ t }) {
  const c = T[t];
  return <span className={`px-2 py-0.5 rounded-full text-[11px] font-bold ${c.badge}`}>{c.short}</span>;
}

function PriBadge({ p }) {
  const m = { CRITICAL:"bg-red-600 text-white", HIGH:"bg-orange-500 text-white",
               MEDIUM:"bg-yellow-300 text-yellow-900", "N/A":"bg-slate-200 text-slate-500" };
  return <span className={`px-1.5 py-0.5 rounded text-[10px] font-black uppercase ${m[p]||m["N/A"]}`}>{p}</span>;
}

function StatusPill({ s }) {
  const c = SC[s] || SC["Not Started"];
  return (
    <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium ${c.bg} ${c.tx}`}>
      <span className={`w-1.5 h-1.5 rounded-full ${c.dot}`}/>
      {s}
    </span>
  );
}

function AppCard({ app, onUpdate, onRemove }) {
  const [open, setOpen] = useState(false);
  const [confirmRemove, setConfirmRemove] = useState(false);
  const tc = T[app.track];
  const borderCls = app.group === "rejected"
    ? "border-slate-200 bg-slate-100 opacity-50 grayscale"
    : app.pulse
      ? "border-orange-300 bg-orange-50 pulse-card"
      : app.highlight
        ? `border-2 ${tc.hlBorder} ${tc.bg}`
        : "border-slate-200 bg-white hover:shadow-sm hover:border-slate-300";

  return (
    <div className={`rounded-xl border p-4 transition-all ${borderCls}`}>
      <div className="flex flex-col sm:flex-row sm:items-start gap-2">
        <div className="flex-1 min-w-0">
          <div className="flex flex-wrap items-center gap-1.5 mb-1">
            <span className="font-black text-slate-900 text-sm">{app.company}</span>
            {app.jobId && <span className="font-mono text-[10px] text-slate-400">#{app.jobId}</span>}
            {app.pulse && (
              <span className="text-[10px] font-black bg-orange-500 text-white px-1.5 py-0.5 rounded animate-pulse">⚡ ASSESSMENT</span>
            )}
            {app.highlight && !app.pulse && (
              <span className={`text-[10px] font-black px-1.5 py-0.5 rounded ${tc.badge}`}>★ PRIORITY</span>
            )}
            {app.openDate && (() => {
              const d = daysUntil(app.openDate);
              if (d <= 0) return <span className="text-[10px] font-black bg-green-500 text-white px-1.5 py-0.5 rounded animate-pulse">🟢 OPEN NOW</span>;
              if (d <= 21) return <span className="text-[10px] font-black bg-amber-400 text-amber-900 px-1.5 py-0.5 rounded">⏱ {d}d</span>;
              return <span className="text-[10px] font-mono text-slate-400 px-1.5 py-0.5 rounded border border-slate-200">opens {app.openDate}</span>;
            })()}
          </div>
          <p className="text-slate-700 text-sm leading-snug">{app.role}</p>
          <p className="text-[11px] text-slate-400 mt-0.5">{app.deadline}</p>
        </div>
        <div className="flex flex-col items-end gap-1.5 shrink-0">
          <div className="flex items-center gap-1.5">
            <TrackBadge t={app.track}/>
            <PriBadge p={app.priority}/>
          </div>
          <span className="text-xs font-semibold text-slate-500">{app.pay}</span>
          <Stars val={app.fit} onChange={v => onUpdate(app.id, { fit:v })}/>
        </div>
      </div>
      <div className="flex items-center justify-between mt-3 pt-2.5 border-t border-slate-100">
        <div className="flex items-center gap-2 flex-wrap">
          <select value={app.status} onChange={e => onUpdate(app.id, { status:e.target.value })}
            className="text-xs border border-slate-200 rounded-lg px-2 py-1 bg-white focus:outline-none focus:ring-2 focus:ring-blue-300 cursor-pointer">
            {STATUS_OPTS.map(s => <option key={s}>{s}</option>)}
          </select>
          <StatusPill s={app.status}/>
        </div>
        <div className="flex items-center gap-3">
          {onRemove && (confirmRemove
            ? <span className="flex items-center gap-2">
                <button onClick={() => onRemove(app.id)} className="text-[11px] text-red-500 font-bold hover:text-red-700">confirm remove</button>
                <button onClick={() => setConfirmRemove(false)} className="text-[11px] text-slate-400 hover:text-slate-600">cancel</button>
              </span>
            : <button onClick={() => setConfirmRemove(true)} className="text-[11px] text-red-300 hover:text-red-500">
                ✕ remove
              </button>
          )}
          <button onClick={() => setOpen(!open)}
            className="text-[11px] text-slate-400 hover:text-slate-600">
            {open ? "▲ hide" : "▼ notes"}
          </button>
        </div>
      </div>
      {open && (
        <div className="mt-2.5">
          <textarea value={app.notes} rows={3}
            onChange={e => onUpdate(app.id, { notes:e.target.value })}
            className="w-full text-xs text-slate-600 border border-slate-200 rounded-lg p-2.5 resize-none bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-200"
            placeholder="Add personal notes…"/>
        </div>
      )}
    </div>
  );
}

  const crit = apps.filter(a => a.priority === "CRITICAL").length;
  const off  = apps.filter(a => a.status === "Offer").length;
  const stats = [
    { l:"Total Tracked",    v:tot,  bg:"bg-slate-100", tx:"text-slate-700" },
    { l:"Applied / Active", v:act,  bg:"bg-blue-50",   tx:"text-blue-700"  },
    { l:"In Assessment",    v:asm,  bg:"bg-orange-50", tx:"text-orange-700"},
    { l:"Critical Priority",v:crit, bg:"bg-red-50",    tx:"text-red-700"   },
    { l:"Offers",           v:off,  bg:"bg-green-50",  tx:"text-green-700" },
  ];
  return (
    <div className="grid grid-cols-3 sm:grid-cols-5 gap-3 mb-6">
      {stats.map(s => (
        <div key={s.l} className={`${s.bg} rounded-xl p-3 text-center`}>

          <div className="text-[10px] text-slate-500 mt-0.5 leading-tight">{s.l}</div>
        </div>
      ))}
    </div>

function LiveMonitor({ apps, onUpdate }) {
  const [now, setNow] = useState(() => new Date());

  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 60000);
    return () => clearInterval(id);
  }, []);

  const watched = apps.filter(a => a.openDate && a.group !== 'rejected' && a.status !== 'Applied');
  if (!watched.length) return null;

  const openNow   = watched.filter(a => isOpenNow(a.openDate, now))
                           .sort((a,b) => new Date(b.openDate) - new Date(a.openDate));
  const upcoming  = watched.filter(a => !isOpenNow(a.openDate, now))
                           .sort((a,b) => new Date(a.openDate) - new Date(b.openDate));
  const next      = upcoming[0];
  const nextDays  = next ? daysUntil(next.openDate, now) : null;

  return (
    <div className="mb-6 rounded-2xl overflow-hidden border border-slate-700 shadow-md">
      <div className="bg-gradient-to-r from-slate-900 to-slate-800 px-5 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div className="flex items-center gap-2.5">
          <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse shrink-0"/>
          <span className="text-white font-black text-sm">Live Application Monitor</span>
          <span className="text-slate-500 text-[10px] font-mono hidden sm:inline">· refreshes every 60s</span>
        </div>
        <div className="flex items-center gap-3 text-xs flex-wrap">
          {openNow.length > 0 && <span className="text-green-400 font-black">{openNow.length} open now</span>}
          {upcoming.length > 0 && <span className="text-slate-400">{upcoming.length} upcoming</span>}
          {next && <span className="text-amber-400 font-semibold">next: {next.company} in {nextDays}d</span>}
        </div>
      </div>

      {openNow.length > 0 && (
        <div className="bg-green-950/40 border-t border-green-900/40 px-5 py-3">
          <div className="text-[10px] font-black text-green-400 uppercase tracking-wider mb-2.5">Applications Now Open</div>
          <div className="flex flex-col gap-2">
            {openNow.map(a => (
              <div key={a.id} className="flex items-center justify-between gap-3">
                <div className="flex items-center gap-2 min-w-0">
                  <span className="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse shrink-0"/>
                  <span className="text-green-300 font-black text-xs shrink-0">{a.company}</span>
                  <span className="text-green-600 text-[11px] truncate hidden sm:inline">{a.role}</span>
                </div>
                <button onClick={() => onUpdate(a.id, { group:'immediate', deadline:'🟢 OPEN NOW — Apply immediately!' })}
                  className="text-[10px] bg-green-600 text-white px-2.5 py-1 rounded-lg font-bold hover:bg-green-500 shrink-0 whitespace-nowrap">
                  → Move to Apply Now
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      {upcoming.length > 0 && (
        <div className="bg-slate-800/40 border-t border-slate-700/40 px-5 py-3">
          <div className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-2.5">Upcoming Openings</div>
          <div className="flex gap-2.5 overflow-x-auto pb-1">
            {upcoming.slice(0, 8).map(a => {
              const d = daysUntil(a.openDate, now);
              const tc = T[a.track];
              const urgent = d <= 14;
              return (
                <div key={a.id} className={`flex-shrink-0 rounded-xl px-3 py-2 min-w-[130px] border ${urgent ? 'bg-amber-900/30 border-amber-700/40' : 'bg-slate-700/40 border-slate-600/30'}`}>
                  <div className="text-[9px] font-black mb-0.5" style={{color: tc.accent}}>{tc.short}</div>
                  <div className="text-white text-[11px] font-bold leading-tight">{a.company}</div>
                  <div className={`text-[10px] mt-1 font-semibold ${urgent ? 'text-amber-400' : 'text-slate-400'}`}>{d}d · {a.openDate}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── ROADMAP: Track Column (shared by PhaseCard rows) ── */
function TrackCol({ tid, phase, checked, onToggle }) {
  const tc = T[tid];

  if (!td) return null;
  return (
    <div className="p-4">
      <div className={`flex items-center gap-2 mb-3 pb-2 border-b ${tc.border}`}>
        <span className="w-2 h-2 rounded-full shrink-0" style={{ background:tc.accent }}/>

        <span className="text-[11px] text-slate-400 truncate">{td.summary}</span>

        <div className={`mb-3 p-3 rounded-lg border-2 ${tc.hlBorder} ${tc.bg}`}>
          <div className="flex items-center flex-wrap gap-1 mb-1.5">
            <span className="text-xs font-black text-blue-700">{td.milestone.label}</span>
            <GTransferTooltip/>
          </div>
          <p className="text-[11px] text-slate-600 leading-relaxed">{td.milestone.detail}</p>
        </div>
      )}

        {td.tasks.map((task, i) => {
          const key = `${phase.id}-${tid}-${i}`;
          const done = !!checked[key];
          const red  = task.startsWith("🔴");
          const warn = task.startsWith("⚠️");
          return (
            <li key={i} className="flex items-start gap-2 group">
              <button onClick={() => onToggle(key)}
                className={`mt-0.5 w-4 h-4 rounded border-2 flex items-center justify-center shrink-0 transition-colors ${
                  done ? "bg-emerald-500 border-emerald-500"
                       : red||warn ? "border-red-400" : "border-slate-300 group-hover:border-blue-400"
                }`}>
                {done && <span className="text-white text-[9px] font-black">✓</span>}
              </button>
              <span className={`text-xs leading-relaxed ${
                done ? "line-through text-slate-400"
                     : red||warn ? "text-red-700 font-bold" : "text-slate-700"
              }`}>{task}</span>
            </li>
          );
        })}
      </ul>
    </div>
  );
}

/* ── ROADMAP: Phase Card ── */
function PhaseCard({ phase, checked, onToggle }) {
  const isConvergence = phase.convergence;
  const headerCls = isConvergence
    ? "bg-gradient-to-r from-amber-500 to-yellow-500"
    : phase.urgent
      ? "bg-gradient-to-r from-orange-600 to-red-600"
      : "bg-gradient-to-r from-slate-700 to-slate-800";
  const cardBorderCls = isConvergence ? "border-amber-300" : phase.urgent ? "border-orange-200" : "border-slate-200";

  return (
    <div className={`rounded-2xl overflow-hidden shadow-sm border mb-5 ${cardBorderCls}`}>
      <div className={`px-5 py-3 flex items-center justify-between ${headerCls}`}>
        <div className="flex items-center gap-2">
          {isConvergence && <span className="text-xl">⭐</span>}
          <span className={`font-black text-sm ${isConvergence ? "text-amber-900" : "text-white"}`}>{phase.label}</span>
          {phase.urgent && <span className="text-[10px] bg-white/20 text-white px-2 py-0.5 rounded-full font-semibold">URGENT</span>}
          {isConvergence && <span className="text-[10px] bg-amber-900/20 text-amber-900 px-2 py-0.5 rounded-full font-bold">ELITE TIER — ALL 5 TRACKS CONVERGE</span>}
        </div>
        <span className={`text-xs ${isConvergence ? "text-amber-800" : "text-white/70"}`}>{phase.period}</span>
      </div>

      {phase.timeline && (
        <div className={`px-5 py-2 flex items-center gap-2 text-[11px] border-t ${
          isConvergence ? "bg-amber-400/20 border-amber-400/30" : phase.urgent ? "bg-red-950/30 border-white/10" : "bg-slate-600/20 border-white/10"
        }`}>
          <span className={isConvergence ? "text-amber-900/60" : "text-white/50"}>Timeline</span>
          <span className={isConvergence ? "text-amber-900/30" : "text-white/25"}>·</span>
          <span className={`font-bold ${isConvergence ? "text-amber-900" : "text-white"}`}>{phase.timeline.start}</span>
          <span className={isConvergence ? "text-amber-900/40" : "text-white/40"}>→</span>
          <span className={`font-bold ${isConvergence ? "text-amber-900" : "text-white"}`}>{phase.timeline.end}</span>
          <span className={isConvergence ? "text-amber-900/30" : "text-white/25"}>·</span>
          <span className={isConvergence ? "text-amber-800/70" : "text-white/60"}>{phase.timeline.duration}</span>
        </div>
      )}

      {/* Row 1: Tracks 1–3 */}
      <div className="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x divide-slate-100 bg-white">
        {[1,2,3].map(tid => <TrackCol key={tid} tid={tid} phase={phase} checked={checked} onToggle={onToggle}/>)}
      </div>

      {/* Row 2: Tracks 4–5 */}
      {(phase.tracks[4] || phase.tracks[5]) && (
        <div className="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-slate-100 bg-white border-t-2 border-slate-100">
          {[4,5].map(tid => <TrackCol key={tid} tid={tid} phase={phase} checked={checked} onToggle={onToggle}/>)}
        </div>
      )}
    </div>
  );
}

          <div key={k} className="flex items-center gap-1.5 text-xs text-slate-600">
            <span className="w-3 h-3 rounded-sm" style={{ background:cols[k] }}/>
            {names[k]}
          </div>
        ))}
      </div>
      <div className="space-y-5">
        {SAL.map((pt,i) => (
          <div key={i}>
            <div className="text-[10px] font-bold text-slate-400 mb-2 whitespace-pre-line">{pt.yr}</div>
            <div className="space-y-1.5">
              {keys.map(k => {
                const val = pt[k];
                const lk  = "l" + k.slice(1);
                return (
                  <div key={k} className="flex items-center gap-2">
                    <div className="w-12 text-[10px] text-slate-400 text-right shrink-0 uppercase">{k}</div>
                    <div className="flex-1 bg-slate-100 rounded-full h-6 relative overflow-hidden">
                      {val > 0
                        ? <div className="h-full rounded-full flex items-center justify-end pr-2"
                            style={{ width:`${(val/SAL_MAX)*100}%`, background:cols[k] }}>
                            <span className="text-white text-[9px] font-bold whitespace-nowrap">{pt[lk]}</span>
                          </div>
                        : <div className="h-full flex items-center pl-3">
                            <span className="text-slate-400 text-[9px] italic">{pt[lk]}</span>
                          </div>
                      }
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── ROADMAP TAB ── */
function RoadmapTab({ checked, setChecked, skills, onSkillChange }) {
  const total = PHASES.reduce((acc,p) =>
    acc + Object.values(p.tracks).reduce((a,t) => a + (t.tasks?.length||0), 0), 0);
  const done = Object.values(checked).filter(Boolean).length;
  const pct  = total > 0 ? Math.round((done/total)*100) : 0;
  const onToggle = k => setChecked(prev => ({ ...prev, [k]:!prev[k] }));

  return (
    <div>
      <div className="bg-white rounded-2xl border border-slate-200 p-5 mb-5 shadow-sm">
        <div className="flex items-center justify-between mb-3">
          <div>
            <h2 className="text-sm font-bold text-slate-800">Career Roadmap Progress</h2>
            <p className="text-xs text-slate-500 mt-0.5">7 phases · 5 parallel tracks · Google Cloud, Consulting, Frontier AI, Big 4, Finance & IB</p>
          </div>
          <div className="text-right">
            <div className="text-3xl font-black text-slate-800">{pct}%</div>
            <div className="text-xs text-slate-400">{done}/{total} tasks</div>
          </div>
        </div>
        <div className="h-2.5 bg-slate-100 rounded-full overflow-hidden">
          <div className="h-full bg-gradient-to-r from-blue-500 via-violet-500 to-orange-500 rounded-full transition-all duration-700"
               style={{ width:`${pct}%` }}/>
        </div>
      </div>

      <div className="flex flex-wrap gap-3 mb-5">
        {Object.keys(T).map(Number).map(tid => {
          const tc = T[tid];
          return (
            <div key={tid} className={`flex items-center gap-2 px-3 py-2 rounded-xl border ${tc.border} ${tc.bg}`}>
              <span className="w-2.5 h-2.5 rounded-full" style={{ background:tc.accent }}/>
              <div>
                <div className={`text-xs font-bold ${tc.text}`}>{tc.short}</div>
                <div className="text-[10px] text-slate-500">{tc.label}</div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-2xl p-4 mb-5">
        <div className="flex items-start gap-3">
          <span className="text-2xl shrink-0">💳</span>
          <div>
            <div className="text-sm font-bold text-amber-800">Your FinTech Edge — The Citibank Advantage</div>
            <p className="text-xs text-amber-700 mt-1 leading-relaxed">
              Two Citibank internships = you understand how financial enterprises struggle with AI adoption <em>from the inside</em>.
              Frame this everywhere: <strong>"I want to solve that from the tech side."</strong> FinTech FDE is elite across all 3 tracks:
              banks spend billions on AI and need FDEs who understand compliance, legacy systems, and data sensitivity.
              Anthropic's safety-first culture is especially valuable here — financial services is the compliance-heaviest sector in AI adoption.
            </p>
          </div>
        </div>
      </div>

      <SkillsGapTracker skills={skills} onSkillChange={onSkillChange}/>

      {PHASES.map(p => <PhaseCard key={p.id} phase={p} checked={checked} onToggle={onToggle}/>)}

      <SalaryChart/>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   MAIN APP
═══════════════════════════════════════════════════════════ */
function App() {
  const [tab, setTab] = useState("tracker");

  const [apps, setApps] = useState(() => {
    try { const s = localStorage.getItem('tracker_apps'); return s ? JSON.parse(s) : APPS0; }
    catch { return APPS0; }
  });

  const [checked, setChecked] = useState(() => {
    try { const s = localStorage.getItem('tracker_checked'); return s ? JSON.parse(s) : {}; }
    catch { return {}; }
  });

  const [skills, setSkills] = useState(() => {
    try { const s = localStorage.getItem('tracker_skills'); return s ? JSON.parse(s) : SKILLS_BUILD0; }
    catch { return SKILLS_BUILD0; }
  });

  useEffect(() => { localStorage.setItem('tracker_apps', JSON.stringify(apps)); }, [apps]);
  useEffect(() => { localStorage.setItem('tracker_checked', JSON.stringify(checked)); }, [checked]);
  useEffect(() => { localStorage.setItem('tracker_skills', JSON.stringify(skills)); }, [skills]);

  useEffect(() => {
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
    const checkOpenings = () => {
      const now = new Date();
      const notified = JSON.parse(localStorage.getItem('notified_apps') || '[]');
      setApps(prev => {
        const newlyOpen = prev.filter(a =>
          a.openDate &&
          new Date(a.openDate) <= now &&
          !notified.includes(a.id) &&
          !['active', 'rejected', 'immediate'].includes(a.group)
        );
        if (!newlyOpen.length) return prev;
        newlyOpen.forEach(a => {
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(`🟢 ${a.company} — Applications Now Open!`, {
              body: a.role,
              tag: `app-open-${a.id}`,
            });
          }
        });
        localStorage.setItem('notified_apps', JSON.stringify([...notified, ...newlyOpen.map(a => a.id)]));
        return prev;
      });
    };
    checkOpenings();
    const id = setInterval(checkOpenings, 60000);
    return () => clearInterval(id);
  }, []);

  const onUpdate = useCallback((id, patch) => {
    setApps(prev => prev.map(a => {
      if (a.id !== id) return a;
      const merged = { ...a, ...patch };
      if (patch.status === "Rejected") merged.group = "rejected";
      else if (patch.status === "Assessment") merged.group = "active";
      return merged;
    }));
  }, []);

  const onAdd = useCallback((entry) => {
    setApps(prev => [...prev, entry]);
  }, []);

  const onRemove = useCallback((id) => {
    setApps(prev => prev.filter(a => a.id !== id));
  }, []);

  const onSkillChange = useCallback((id, pct) => {
    setSkills(prev => prev.map(s => s.id===id ? {...s, pct} : s));
  }, []);

  return (
    <div className="min-h-screen bg-slate-50">
      <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 sticky top-0 z-50 shadow-xl">
        <div className="max-w-5xl mx-auto px-4 py-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 className="text-white font-black text-lg tracking-tight">Sameeksha's Career Command Center</h1>
              <p className="text-slate-400 text-xs mt-0.5">UT Austin CS '28 · AI + FinTech · 3 tracks → Elite FDE</p>
            </div>
            <div className="flex items-center gap-1 bg-slate-700/50 rounded-xl p-1 shrink-0">
              {["tracker","roadmap"].map(t => (
                <button key={t} onClick={() => setTab(t)}
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${
                    tab===t ? "bg-white text-slate-900 shadow" : "text-slate-400 hover:text-white"
                  }`}>
                  {t === "tracker" ? "Application Tracker" : "Career Roadmap"}
                </button>
              ))}
            </div>
          </div>
        </div>
      </div>

      <div className="max-w-5xl mx-auto px-4 py-6">
        {tab === "tracker"
          ? <TrackerTab apps={apps} onUpdate={onUpdate} onAdd={onAdd} onRemove={onRemove}/>
          : <RoadmapTab checked={checked} setChecked={setChecked} skills={skills} onSkillChange={onSkillChange}/>
        }
      </div>

      <div className="max-w-5xl mx-auto px-4 pb-8 text-center text-xs text-slate-400">
        All compensation figures are estimates based on public data · Built May 2026
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
